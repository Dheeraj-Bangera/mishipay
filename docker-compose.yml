version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: usage_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
  
  cache:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  web:
    build:
      context: .
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - DATABASE_URL=postgresql://user:password@db:5432/usage_db
    volumes:
      - .:/app
    ports:
      - "5001:5000"
    depends_on:
      - db
      - cache
    networks:
      - app-network
  
  test:
    build:
      context: .
    command: ["pytest"]
    environment:
      FLASK_ENV: testing
      DATABASE_URL: postgresql://user:password@db:5432/test_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      PYTHONPATH: /app
    volumes:
      - .:/app
    depends_on:
      - db
      - cache
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network: